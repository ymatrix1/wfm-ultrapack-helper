name: Build, Test & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Linux daemon
        run: |
          make linux

      - name: Install exfatprogs (exFAT validation)
        run: |
          sudo apt-get update
          sudo apt-get install -y exfatprogs

      - name: Run Protocol & Integration Tests
        run: |
          node tests/protocol-test.js

      - name: Run End-to-End Daemon Tests
        run: |
          node tests/e2e-test.js

      - name: Run Crypto Tests
        run: |
          node tests/crypto-test.js

      - name: Run RSA Tests
        run: |
          node tests/rsa-test.js

      - name: Run Listing -> exFAT/ffpfsc Tests
        run: |
          node tests/listing-test.js

  sanitizers:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASAN + UBSAN
            san: address,undefined
            run_prefix: ""
          - name: TSAN
            san: thread
            run_prefix: "setarch x86_64 -R"
    env:
      SAN: ${{ matrix.san }}
      EXTRA_CFLAGS: -fsanitize=${{ matrix.san }} -fno-omit-frame-pointer -g
      WUP_SOCKET: /tmp/wup-sanitizer.sock
      ASAN_OPTIONS: detect_leaks=0:log_path=/tmp/san/asan
      UBSAN_OPTIONS: halt_on_error=0:print_stacktrace=1:log_path=/tmp/san/ubsan
      TSAN_OPTIONS: halt_on_error=0:report_signal_unsafe=0:log_path=/tmp/san/tsan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exfatprogs
        run: |
          sudo apt-get update
          sudo apt-get install -y exfatprogs

      - name: Relax ASLR for ThreadSanitizer
        if: matrix.san == 'thread'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build instrumented daemon
        run: |
          mkdir -p /tmp/san
          make linux SAN=$SAN

      - name: Run all suites on instrumented builds
        run: |
          status=0
          for t in protocol-test e2e-test mt-test crypto-test rsa-test listing-test pkg-test fih-test; do
            echo "::group::$t"
            rm -f /tmp/san/*
            ${{ matrix.run_prefix }} node tests/$t.js || status=1
            if ls /tmp/san/* >/dev/null 2>&1; then
              echo "::error::sanitizer reports during $t"
              cat /tmp/san/* | head -80
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  build-ps5:
    name: Build PS5 ELF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools & LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config clang-15 lld-15 bash socat

      - name: Build & Install PS5 Payload SDK
        run: |
          git clone --recurse-submodules https://github.com/ps5-payload-dev/sdk.git ps5-sdk
          cd ps5-sdk
          make
          sudo make DESTDIR=/opt/ps5-payload-sdk install
          echo "PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk" >> $GITHUB_ENV

      - name: Build wfm-ultrapack-helper.elf
        run: |
          export PS5_PAYLOAD_SDK=/opt/ps5-payload-sdk
          make ps5

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wfm-ultrapack-helper-elf
          path: wfm-ultrapack-helper.elf

  release:
    name: Auto Release
    needs: [ test, build-ps5 ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download PS5 ELF
        uses: actions/download-artifact@v4
        with:
          name: wfm-ultrapack-helper-elf

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wfm-ultrapack-helper.elf
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
