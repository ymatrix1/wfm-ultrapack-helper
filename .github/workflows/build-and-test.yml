name: Build, Test & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    name: Test & Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Linux daemon
        run: |
          make linux

      - name: Run Protocol & Integration Tests
        run: |
          node tests/protocol-test.js

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: wfm-ultrapack-helper-linux
          path: wfm-ultrapack-helper-linux

  release:
    name: Auto Release
    needs: [ test ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: wfm-ultrapack-helper-linux

      - name: Package Release Assets
        run: |
          chmod +x wfm-ultrapack-helper-linux
          tar -czvf wfm-ultrapack-helper-linux.tar.gz wfm-ultrapack-helper-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wfm-ultrapack-helper-linux.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
